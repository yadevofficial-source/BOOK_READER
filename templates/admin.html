{% extends "layout.html" %}

{% block content %}
<div class="container my-5" style="max-width: 900px; min-height: 70vh;">
  <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-4">
    <h2 class="text-white">Admin Dashboard - Reviews</h2>
    <a href="{{ url_for('admin_logout') }}" class="btn btn-outline-danger btn-sm">Logout</a>
  </div>

  {% if reviews %}
    <div class="table-responsive">
      <table class="table table-dark table-striped table-bordered border-secondary align-middle">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Review</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          {% for review in reviews %}
            <tr>
              <td class="text-nowrap text-white small">{{ review.created_at }}</td>
              <td class="fw-bold">{{ review.name }}</td>
              <td>{{ review.review_text }}</td>
              <td class="text-center">
                <!-- Delete Form for this specific review ID -->
                <form action="{{ url_for('delete_review', id=review.id) }}" method="POST" style="display:inline;">
                  <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this review?');">
                    Delete
                  </button>
                </form>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <p class="text-muted text-center py-5">No reviews found yet.</p>
  {% endif %}
</div>
{% endblock %}
