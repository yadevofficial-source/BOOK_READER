{% extends "layout.html" %}

{% block content %}
<div class="container my-5" style="max-width: 500px; min-height: 50vh;">
    <div class="card bg-dark text-light border-secondary shadow-lg p-4">
        <h2 class="h3 text-white border-bottom border-secondary pb-3 mb-4">Admin Access Required</h2>
        
        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}
        
        <form method="POST">
            <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-outline-light w-100">Login</button>
        </form>
    </div>
</div>
{% endblock %}
